<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Architecture: the AI Game Developer App adds the package, writes the config and launches the game. Inside the game process your code registers objects and calls Tick; the Brutal-MCP core and optional extensions expose BRUTAL state through RQL. The plugin connects over SignalR to the MCP server, which serves AI agents over MCP.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080F17"/><stop offset="1" stop-color="#030609"/></linearGradient>
    <radialGradient id="hzR" cx="0.18" cy="0" r="0.6"><stop offset="0" stop-color="#FF002A" stop-opacity="0.16"/><stop offset="1" stop-color="#FF002A" stop-opacity="0"/></radialGradient>
    <radialGradient id="hzB" cx="0.85" cy="0" r="0.6"><stop offset="0" stop-color="#3B9BFF" stop-opacity="0.14"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8C2D2" fill-opacity="0.08"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF002A" stop-opacity="0"/><stop offset="0.3" stop-color="#FF2448" stop-opacity="0.6"/><stop offset="0.7" stop-color="#3B9BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1620"/><stop offset="1" stop-color="#070D14"/></linearGradient>
    <linearGradient id="logoL" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8395AD"/></linearGradient>
    <linearGradient id="logoR" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#E1E8F1"/><stop offset="1" stop-color="#455974"/></linearGradient>
    <linearGradient id="logoB" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#AABBD0"/></linearGradient>
    <radialGradient id="logoGlow"><stop offset="0" stop-color="#6FA8D0" stop-opacity=".18"/><stop offset="1" stop-color="#6FA8D0" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A73"/><stop offset="1" stop-color="#6FA8D0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="600" rx="18"/></clipPath>
  </defs>
  <style>
    .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; white-space: pre; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.r { animation-duration: 60s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="600" fill="url(#bg)"/><rect width="1200" height="600" fill="url(#hzR)"/><rect width="1200" height="600" fill="url(#hzB)"/>
    <rect width="1200" height="600" fill="url(#dots)"/>
    <text x="40" y="56" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">HOW IT CONNECTS</text><rect x="40" y="80" width="560" height="96" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="92" width="3" height="72" rx="1.5" fill="#22C55E"/><text x="62" y="124.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">AI Game Developer App</text><text x="62" y="150.0" class="s" font-size="18" fill="#8AA6B8">adds the package · writes the config · launches the game</text><path id="w1" d="M320 176 L320 226" fill="none" stroke="#22C55E" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#22C55E"><animateMotion dur="1.6s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle><rect x="40" y="226" width="560" height="340" rx="18" fill="none" stroke="rgba(111,168,208,0.45)" stroke-dasharray="6 6"/><text x="64" y="262" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">GAME PROCESS · .NET 10</text><rect x="60" y="284" width="250" height="128" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><text x="78" y="344.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Your game code</text><text x="78" y="370.0" class="s" font-size="18" fill="#8AA6B8">Register(obj, name)</text><text x="78" y="392.0" class="s" font-size="18" fill="#8AA6B8">Tick() every frame</text><rect x="330" y="284" width="250" height="128" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="330" y="296" width="3" height="104" rx="1.5" fill="#FF5A73"/><text x="352" y="344.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Brutal-MCP core</text><text x="352" y="370.0" class="s" font-size="18" fill="#8AA6B8">RQL · tools · logs</text><text x="352" y="392.0" class="s" font-size="18" fill="#8AA6B8">generated skills</text><g transform="translate(521.22 288.11) scale(0.0523)"><path d="M512 194 L512 504 L366 785 L185 785 Z" fill="url(#logoL)"/><path d="M512 194 L839 785 L658 785 L512 504 Z" fill="url(#logoR)"/><path d="M512 194 L512 294 L223 767 L185 785 Z" fill="url(#logoB)"/></g><rect x="60" y="428" width="520" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="60" y="440" width="3" height="96" rx="1.5" fill="#6FA8D0"/><text x="82" y="484.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Extensions for BRUTAL packages</text><text x="82" y="510.0" class="s" font-size="18" fill="#8AA6B8">ImGui · Glfw · Sdl · Jolt · Box2D</text><text x="82" y="532.0" class="s" font-size="18" fill="#8AA6B8">Fmod · RakNet · Vma · RenderDoc</text><rect x="690" y="284" width="220" height="128" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="690" y="296" width="3" height="104" rx="1.5" fill="#6FA8D0"/><text x="712" y="344.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">MCP server</text><text x="712" y="370.0" class="s" font-size="18" fill="#8AA6B8">local, or the cloud</text><text x="712" y="392.0" class="s" font-size="18" fill="#8AA6B8">at ai-game.dev</text><rect x="970" y="284" width="190" height="128" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="970" y="296" width="3" height="104" rx="1.5" fill="#EAB308"/><text x="992" y="344.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">AI agent</text><text x="992" y="370.0" class="s" font-size="18" fill="#8AA6B8">Claude Code</text><text x="992" y="392.0" class="s" font-size="18" fill="#8AA6B8">Codex · Cursor</text><path id="w2" d="M580 348 L690 348" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.8s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle><path id="w3" d="M690 360 L580 360" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.8s" begin="-0.9s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle><path id="w4" d="M910 348 L970 348" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.4s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle><text x="635" y="332" text-anchor="middle" class="s" font-size="18" fill="#8AA6B8">SignalR</text><text x="940" y="332" text-anchor="middle" class="s" font-size="18" fill="#8AA6B8">MCP</text><text x="690" y="462" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">WHAT THE AGENT CAN DO</text><text x="690" y="498" class="m" font-size="18" fill="#FAFFFD">rql-query</text><text x="866" y="498" class="s" font-size="18" fill="#8AA6B8">read live state</text><text x="690" y="526" class="m" font-size="18" fill="#FAFFFD">rql-mutate</text><text x="866" y="526" class="s" font-size="18" fill="#8AA6B8">set values, call methods</text><text x="690" y="554" class="m" font-size="18" fill="#FAFFFD">script-execute</text><text x="866" y="554" class="s" font-size="18" fill="#8AA6B8">C# in Debug builds</text><text x="690" y="582" class="m" font-size="18" fill="#FAFFFD">skills</text><text x="866" y="582" class="s" font-size="18" fill="#8AA6B8">learn BRUTAL</text>
